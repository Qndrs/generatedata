name: Quality
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DG_QUALITY_INSTANCE: datagenerator-ci
      DG_QUALITY_CONFIG_DIR: ${{ runner.temp }}/datagenerator-ci
      DG_QUALITY_PORT: '19095'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build and verify isolated application
        run: node tools/local.mjs quality
      - name: Stop test containers after cancellation or failure
        if: always()
        env:
          DG_INSTANCE: datagenerator-ci
          DG_CONFIG_DIR: ${{ runner.temp }}/datagenerator-ci
        run: |
          if [ -f "$DG_CONFIG_DIR/runtime.env" ]; then
            node tools/local.mjs down
          fi
